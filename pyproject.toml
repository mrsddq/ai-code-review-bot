[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-code-review-bot"
version = "0.1.0"
description = "A deterministic Python code reviewer with JSON and SARIF output"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
reviewbot = "code_review_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"


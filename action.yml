name: AI Code Review Bot
description: Review Python source and write a SARIF-compatible report
inputs:
  path:
    description: File or directory to review
    required: false
    default: .
runs:
  using: composite
  steps:
    - shell: bash
      run: pip install "$GITHUB_ACTION_PATH"
    - shell: bash
      env:
        REVIEW_PATH: ${{ inputs.path }}
      run: reviewbot "$REVIEW_PATH" --format sarif --output review.sarif --fail-on none


name: AI Code Review Bot
description: Review Python source and upload a SARIF-compatible report
inputs:
  path:
    description: File or directory to review
    required: false
    default: .
runs:
  using: composite
  steps:
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: reviewbot "${{ inputs.path }}" --format sarif --output review.sarif --fail-on none

